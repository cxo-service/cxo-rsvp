<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 資訊安全：只允許載入本站的程式與樣式、只能連到 Apps Script；不載入任何外部程式、追蹤碼或字型 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>CXO 餐桌會簽到</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <b id="head">讀取中…</b>
    <div class="sub" id="title"></div>
    <div class="tabs" id="tabs" hidden>
      <button id="tabIn" type="button">📋 現場簽到</button>
      <button id="tabRoll" type="button">📝 事後點名</button>
    </div>
    <div class="bar" id="bar"></div>
  </header>
  <main class="wrap">
    <div id="msg" class="msg" hidden></div>
    <p class="tip" id="tip"></p>
    <div id="list"></div>
    <div class="time" id="time"></div>
  </main>
  <footer class="foot" id="foot" hidden>
    <button id="done" type="button">✔️ 確認完成（其他人算出席）</button>
  </footer>
</body>
</html>
